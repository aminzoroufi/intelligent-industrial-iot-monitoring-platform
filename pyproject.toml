[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "intelligent-industrial-iot-monitoring-platform"
version = "0.1.0"
description = "Low-voltage industrial condition-monitoring portfolio demonstrator"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE.md" }
authors = [
  { name = "Amin Zoroufi", email = "aminn.zoroufi@gmail.com" },
]
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.25.0",
  "paho-mqtt==2.1.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "pyjwt==2.13.0",
  "python-multipart==0.0.31",
  "scikit-learn==1.9.0",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]==7.10.2",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]
docs = [
  "pdfplumber==0.11.9",
  "pillow==12.2.0",
  "pypdf==6.10.0",
  "reportlab==4.4.9",
]

[tool.hatch.build.targets.wheel]
packages = ["services", "contracts", "simulator"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests", "services"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S105", "S106"]
"tests/**/*.py" = ["S105", "S106"]
"scripts/generate_hardware_artifacts.py" = ["E501", "RUF001"]
"scripts/build_reports.py" = ["E501", "RUF001"]
"scripts/verify_reports.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["contracts", "services", "simulator"]

[tool.coverage.run]
branch = true
source = ["contracts", "services", "simulator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
