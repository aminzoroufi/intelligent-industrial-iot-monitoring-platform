name: iiot-monitoring-demo

services:
  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    env_file: ${IIOT_ENV_FILE:-.env}
    command: ["/app/scripts/api-entrypoint.sh"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mqtt-ingestor:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    env_file: ${IIOT_ENV_FILE:-.env}
    command: ["python", "-m", "services.mqtt_ingestor.main"]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/app/run/ingestor-ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  simulated-gateway:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    env_file: ${IIOT_ENV_FILE:-.env}
    command: ["python", "-m", "simulator.gateway_agent"]
    depends_on:
      mosquitto:
        condition: service_healthy
      mqtt-ingestor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/app/run/simulated-gateway-ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  mosquitto-data:
